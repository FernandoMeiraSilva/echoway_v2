<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>EchoWay: a campainha que você vê</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>
    try {
      if (localStorage.getItem('echoway-theme') === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    } catch (_) {}
  </script>
  <script src="auth.js"></script>
  <script>if (!estaLogado()) { location.replace('login.html'); }</script>
</head>

<body>
  <div class="pagina">
    <header>
      <a class="marca" href="index.html">
        <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"
          aria-hidden="true">
          <circle cx="8" cy="16" r="2.6" fill="currentColor" stroke="none" />
          <path d="M14 10a8 8 0 0 1 0 12" />
          <path d="M19 6a14 14 0 0 1 0 20" />
          <path d="M24 2.5a19.5 19.5 0 0 1 0 27" />
        </svg>
        EchoWay
      </a>
      <nav aria-label="Principal">
        <a href="index.html" aria-current="page">Início</a>
        <a href="painel.html">Painel de avisos</a>
        <a href="../index.html" id="sair">Sair</a>
        <button type="button" class="theme-toggle" id="themeToggle" aria-label="Mudar para tema claro"
          aria-pressed="false" title="Alternar tema">
          <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path
              d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
          </svg>
          <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
          </svg>
        </button>
      </nav>
    </header>

    <main class="avisos-centro">
        <div class="lateral" id="lateral">
          <aside class="caixa" id="avisos" aria-labelledby="avisos-titulo">
            <h1 id="avisos-titulo">Avisos</h1>
            <div class="estado"><i></i>Campainha conectada</div>
            <p class="contagem" id="contagem"></p>
            <div id="mensagens" aria-live="polite">
              <p class="vazio">Nenhum toque nas últimas 24 horas.</p>
            </div>
          </aside>
          <button class="btn entendi" type="button" id="entendi" hidden>Entendi</button>
        </div>
    </main>

    <footer>EchoWay</footer>
  </div>

  <script src="painel.js"></script>
</body>

</html>
