<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>EchoWay: entrar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>
    try {
      if (localStorage.getItem('echoway-theme') === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    } catch (_) { }
  </script>
</head>

<body>
  <button type="button" class="theme-toggle theme-toggle-fixed" id="themeToggle" aria-label="Mudar para tema claro"
    aria-pressed="false" title="Alternar tema">
    <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="4" />
      <path
        d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
    </svg>
    <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
    </svg>
  </button>
  <main class="entrada">
    <div class="cartao">
      <figure class="placa">
        <img src="../receptor.jpg" alt="Receptor EchoWay">
      </figure>
      <h1 class="titulo">Entrar</h1>
      <p class="intro">Entre para ver os avisos da sua campainha.</p>
      <form id="form-login">
        <div class="campo">
          <label for="email">E-mail</label>
          <input id="email" type="email" autocomplete="username" placeholder="voce@exemplo.com">
        </div>
        <div class="campo">
          <label for="senha">Senha</label>
          <input id="senha" type="password" autocomplete="current-password">
        </div>
        <button class="btn" type="submit">Entrar</button>
      </form>
      <p class="voltar"><a href="../index.html">Voltar para o início</a></p>
    </div>
  </main>

  <script src="auth.js"></script>
  <script src="login.js"></script>
</body>

</html>
